# =============================
# PRODUCTION ENVIRONMENT
# Hospital Management System
# =============================

# =============================
# APPLICATION CONFIGURATION
# =============================
spring.application.name=${APP_NAME:Hospital}
server.port=${PORT:${SERVER_PORT:8090}}

# =============================
# DATABASE CONFIGURATION
# =============================
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&requireSSL=false&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# =============================
# JPA/HIBERNATE CONFIGURATION
# =============================
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# =============================
# MAIL CONFIGURATION
# =============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# =============================
# LOGGING CONFIGURATION
# =============================
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
logging.level.org.springframework.mail=WARN
logging.level.javax.mail=WARN
logging.level.com.example.Hospital=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.springframework.boot=WARN

# =============================
# SESSION CONFIGURATION
# =============================
spring.session.store-type=none
spring.session.jdbc.initialize-schema=never

# =============================
# PRODUCTION SPECIFIC
# =============================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# =============================
# PERFORMANCE CONFIGURATION
# =============================
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=10

# =============================
# SPRING AI (disabled)
# =============================
spring.ai.vectorstore.mongodb.atlas.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.vectorstore.mongodb.autoconfigure.MongoDBAtlasVectorStoreAutoConfiguration,org.springframework.ai.autoconfigure.vectorstore.mongo.MongoDBVectorStoreAutoConfiguration,org.springframework.ai.autoconfigure.vectorstore.common.VectorStoreAutoConfiguration

