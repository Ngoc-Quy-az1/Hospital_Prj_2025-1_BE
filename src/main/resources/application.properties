# =============================
# MAIN APPLICATION CONFIGURATION
# Hospital Management System
# =============================

# =============================
# PROFILE CONFIGURATION
# =============================
# Default profile: dev (development)
# To run with production profile: --spring.profiles.active=prod
spring.profiles.active=dev

# =============================
# APPLICATION CONFIGURATION
# =============================
spring.application.name=${APP_NAME:Hospital}
server.port=${SERVER_PORT:8090}
spring.config.import=optional:file:.env

# =============================
# JPA/HIBERNATE CONFIGURATION
# =============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# =============================
# LOGGING CONFIGURATION (đơn giản, không placeholder)
# =============================
logging.level.com.example.Hospital=INFO
